<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1820"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#2ec4b6" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#4dabf7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2ec4b6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4dabf7" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1200" fill="url(#sky)"/>
  <rect width="800" height="1200" fill="url(#glow)"/>
  <!-- spire silhouette -->
  <polygon points="400,80 460,400 440,400 480,700 450,700 500,1100 300,1100 350,700 320,700 360,400 340,400" fill="url(#tower)" stroke="#2ec4b6" stroke-width="2" opacity="0.85"/>
  <!-- windows -->
  <g fill="#2ec4b6" opacity="0.6">
    <rect x="385" y="200" width="10" height="14" rx="2"/><rect x="405" y="200" width="10" height="14" rx="2"/>
    <rect x="380" y="320" width="10" height="14" rx="2"/><rect x="410" y="320" width="10" height="14" rx="2"/>
    <rect x="375" y="480" width="12" height="16" rx="2"/><rect x="412" y="480" width="12" height="16" rx="2"/>
    <rect x="370" y="650" width="12" height="16" rx="2"/><rect x="418" y="650" width="12" height="16" rx="2"/>
  </g>
  <!-- ground haze -->
  <ellipse cx="400" cy="1150" rx="380" ry="80" fill="#4dabf7" opacity="0.2"/>
  <text x="400" y="1180" text-anchor="middle" fill="#2ec4b6" font-family="system-ui" font-size="28" font-weight="700" opacity="0.5">Mid Spire</text>
</svg>