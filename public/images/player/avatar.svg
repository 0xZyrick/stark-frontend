<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd4a8"/>
      <stop offset="100%" stop-color="#e8a86a"/>
    </linearGradient>
    <linearGradient id="helm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2ec4b6"/>
      <stop offset="100%" stop-color="#1a9e92"/>
    </linearGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2433"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </linearGradient>
  </defs>
  <circle cx="48" cy="48" r="46" fill="#151c28" stroke="#ff9f1c" stroke-width="3"/>
  <!-- suit shoulders -->
  <ellipse cx="48" cy="78" rx="32" ry="18" fill="url(#suit)"/>
  <!-- helmet -->
  <circle cx="48" cy="40" r="24" fill="url(#helm)" stroke="#5eead4" stroke-width="2"/>
  <!-- visor -->
  <ellipse cx="48" cy="42" rx="16" ry="12" fill="#0a1628" opacity="0.85"/>
  <ellipse cx="48" cy="40" rx="12" ry="8" fill="#2ec4b6" opacity="0.35"/>
  <!-- glow dot -->
  <circle cx="42" cy="38" r="3" fill="#fff" opacity="0.7"/>
  <!-- rank pin -->
  <circle cx="66" cy="28" r="7" fill="#ff9f1c" stroke="#fff" stroke-width="1.5"/>
